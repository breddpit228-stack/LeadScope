name: LeadScope CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile app.py app_core.py
          python -m py_compile src/*.py

      - name: Run backend tests
        run: python run_tests.py

      - name: Runtime API smoke test
        run: |
          python - <<'PY'
          import app
          html = app.home()
          assert isinstance(html, str) and len(html) > 1000
          assert 'LeadScope research failed to start or complete' in html
          stats = app.api_data_engine_stats()
          workspace = app.api_workspace_v2()
          suggestions = app.api_workspace_suggestions(6)
          library = app.api_library(limit=20)
          assert isinstance(stats, dict) and 'total' in stats
          assert isinstance(workspace, dict) and 'counts' in workspace
          assert isinstance(suggestions, dict) and 'items' in suggestions
          assert isinstance(library, dict) and 'items' in library
          print('LeadScope runtime smoke test OK · version', app.app.version)
          PY

      - name: Workspace v7.6 flow smoke test
        run: |
          python - <<'PY'
          import app
          from src.workspace_v7 import profile_match
          from src.workspace_intelligence import _decision, _decision_reason

          def endpoint(path, method='GET'):
              for route in app.app.routes:
                  if getattr(route, 'path', None) == path and method in (getattr(route, 'methods', None) or set()):
                      return route.endpoint
              raise AssertionError(f'Missing route {method} {path}')

          create = endpoint('/api/workspaces', 'POST')
          index = endpoint('/api/workspaces', 'GET')
          detail = endpoint('/api/workspaces/{workspace_id}', 'GET')
          discover = endpoint('/api/workspaces/{workspace_id}/discover', 'GET')
          select = endpoint('/api/workspaces/{workspace_id}/selected/{company_id}', 'POST')
          context = endpoint('/api/workspaces/{workspace_id}/companies/{company_id}/context', 'GET')
          universe = endpoint('/api/company-universe/stats', 'GET')
          remove = endpoint('/api/workspaces/{workspace_id}', 'DELETE')
          js_asset = endpoint('/assets/workspace-v70.js', 'GET')
          v73_asset = endpoint('/assets/workspace-v73.js', 'GET')

          u = universe()
          assert isinstance(u, dict) and 'total' in u and 'sources' in u

          ws_payload={'name':'CI Fintech','industry':'Fintech','region':'Europe','audience':'B2B','company_size':'51–200','keywords':'payments, payroll','offer':'Research automation'}
          ws = create(ws_payload)
          assert ws['id']
          assert any(x['id'] == ws['id'] for x in index()['items'])
          found = discover(ws['id'], q='', limit=10, page=1)
          assert 'items' in found and 'broader_items' in found and 'relation_counts' in found
          assert 'total_candidates' in found and 'broader_candidates' in found and 'pages' in found
          if found['items']:
              cid = int(found['items'][0]['id'])
              select(ws['id'], cid)
              state = detail(ws['id'])
              assert state['counts']['selected'] >= 1
              assert 'ready' in state and 'source_issues' in state and 'potential' in state
              ctx = context(ws['id'], cid)
              assert ctx['company_id'] == cid and 'profile_match' in ctx and 'decision' in ctx

          strong = profile_match({
              'company_type':'Fintech','category':'Fintech','audience':'B2B',
              'description':'Payments and payroll software for businesses',
              'country':'Poland','city':'Warsaw','team_size_public':''
          }, ws_payload)
          assert 70 <= strong['score'] < 100, strong
          assert strong['tier'] == 'best', strong
          assert strong['industry_relation']['kind'] == 'primary', strong

          service_profile={
              'company_type':'Fintech','category':'Fintech','audience':'B2B',
              'description':'A software development house building custom products for clients across industries including fintech and retail.',
              'country':'Poland','city':'Warsaw','team_size_public':''
          }
          service_row={'segment':'Fintech','business_type':'','seed_tags_json':'["fintech","software"]'}
          service = profile_match(service_profile, ws_payload, service_row)
          assert service['industry_relation']['kind'] == 'serves', service
          assert service['industry_points'] <= 8, service
          assert service['tier'] == 'broader', service
          assert service['score'] < 60, service

          assert _decision(59, 75, 90, 68) == 'POTENTIAL'
          assert 'moderate' in _decision_reason('POTENTIAL', 59, 75, 90, 68).lower()
          assert _decision(70, 25, 90, 56) == 'MONITOR'
          assert _decision(70, 70, 90, 72) == 'CONTACT'

          asset = js_asset()
          v73 = v73_asset()
          assert b'Your workspaces' in asset.body and b'Shortlist' in asset.body and b'openV7Workspace' in asset.body
          assert b'Selected companies' not in asset.body
          assert b'Broader candidates' in v73.body and b'Company Universe' in v73.body and b'Workspace fit' in v73.body
          assert remove(ws['id'])['ok'] is True
          print('Workspace v7.6 flow OK')
          PY

      - name: Check JavaScript syntax
        run: |
          node --check static/workspace_v55.js
          node --check workspace_loader_v56.js
          node --check source_quality_v57.js
          node --check data_engine_v60.js
          node --check workspace_v61.js
          node --check changes_v62.js
          node --check identity_v63.js
          node --check performance_v64.js
          node --check research_controller_v65.js
          node --check workspace_v70.js
          node --check workspace_v73.js

      - name: Guard against recursive DOM observers
        run: |
          if grep -q "new MutationObserver" source_quality_v57.js changes_v62.js workspace_v70.js workspace_v73.js research_controller_v65.js; then
            echo "Global MutationObserver is forbidden in workspace UI because it can create self-triggering browser work."
            exit 1
          fi
